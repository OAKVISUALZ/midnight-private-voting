name: Compile artifacts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Compact developer tools
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"

      # Toolchain pinned to the version in compact.json (0.31.0).
      - name: Install Compact toolchain
        run: compact update "0.31.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile contract
        run: npm run compile --workspace=packages/contract

      - name: List compiled artifacts
        run: find packages/contract/managed -maxdepth 3 -type f | sort

      - name: Commit compiled artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contract/managed
          if ! git diff --cached --quiet; then
            git commit -m "ci: commit compiled managed/ artifacts (Compact 0.31.0) [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi