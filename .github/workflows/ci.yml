name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: cd packages/contract && npx vitest run

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: docker compose up -d --wait
      - run: npm ci
      - run: cd packages/contract && npx vitest run test/voting.integration.test.ts
        timeout-minutes: 15
      - if: always()
        run: docker compose down
